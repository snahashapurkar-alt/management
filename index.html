<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sprintboard – Agile Project Management System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#14183a;--mut:#6b7090;--bd:#e4e6f2;--pri:#6d4aff;--pri2:#9b7bff;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
body[data-t=dark]{--bg:#0d1030;--card:#171b45;--tx:#eceefc;--mut:#9aa0cc;--bd:#272c63;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:.25s}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #6d4aff55}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--bad)}.btn.s{padding:4px 9px;font-size:12px}
#app{display:flex;min-height:100vh}#sb{width:230px;background:linear-gradient(180deg,#14183a,#2a1a6e);color:#fff;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto;transition:.25s}
.logo{font-size:20px;font-weight:800;padding:6px 10px 16px}.logo span{color:#b9a6ff}
.nv{display:flex;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:#cfd2f5;margin-bottom:2px;transition:.15s}.nv:hover{background:#ffffff18}.nv.on{background:linear-gradient(135deg,#6d4aff,#9b7bff);color:#fff}
main{flex:1;min-width:0}.top{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}.top h2{margin:0;font-size:18px;flex:1}.top select{width:auto}
.pg{padding:20px;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;transition:.2s}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat b{font-size:26px;display:block}.stat small,.mut{color:var(--mut)}.card h3{margin:0 0 10px;font-size:15px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px;transition:width .5s}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;align-items:start}
.col{background:var(--bd);border-radius:16px;padding:10px;min-height:200px}.col.ov{outline:2px dashed var(--pri)}.col h4{margin:2px 4px 10px;display:flex;justify-content:space-between}
.tc{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab;border:1px solid transparent;transition:.15s;box-shadow:0 1px 3px #0001}.tc:hover{border-color:var(--pri);transform:translateY(-2px)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;background:#6d4aff22;color:var(--pri);margin:2px 3px 0 0;font-weight:600}
.High{background:#ef444422;color:var(--bad)}.Medium{background:#f59e0b22;color:#d97706}.Low{background:#16a34a22;color:var(--ok)}
.av{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;vertical-align:middle}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tb input,.tb select{width:auto;flex:1;min-width:130px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row:last-child{border:0}
.mdl{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:20}.mdl>div{background:var(--card);border-radius:18px;padding:20px;width:560px;max-width:100%;animation:f .2s}
.mdl label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;bottom:20px;right:20px;z-index:30;display:flex;flex-direction:column;gap:8px}#toast div{background:#14183a;color:#fff;padding:10px 16px;border-radius:12px;border-left:4px solid var(--ok);animation:f .2s}#toast .e{border-color:var(--bad)}
.auth{margin:auto;width:380px;max-width:94%;padding:30px 0}.hl{padding:2px 8px;border-radius:20px;font-weight:700;font-size:12px}.On{background:#16a34a22;color:var(--ok)}.At{background:#f59e0b22;color:#d97706}.De{background:#ef444422;color:var(--bad)}
.col2{display:flex;align-items:flex-end;gap:6px;height:140px}.col2>div{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.col2 i{display:block;background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:6px 6px 0 0;min-height:2px;transition:height .5s}
.lg span{margin-right:10px;font-size:12px;white-space:nowrap}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.empty{text-align:center;color:var(--mut);padding:24px}.hb{display:none}
@media(max-width:800px){#sb{position:fixed;z-index:15;left:-240px}#sb.o{left:0}.hb{display:inline-block}.two{grid-template-columns:1fr}.pg{padding:12px}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const K='sprintboard_v1',$=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const D=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},TD=D(0),COLS=[['todo','To Do'],['prog','In Progress'],['rev','In Review'],['done','Done']],COL=['#6d4aff','#0ea5e9','#f59e0b','#16a34a','#ef4444','#ec4899'];
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function seed(){const u=[['u1','Aisha Khan','admin@demo.com','Admin'],['u2','Rahul Mehta','pm@demo.com','Project Manager'],['u3','Meera Iyer','member@demo.com','Team Member'],['u4','Dev Patel','dev@demo.com','Team Member']].map(a=>({id:a[0],name:a[1],email:a[2],role:a[3],pw:'demo123'}));
const P=[['p1','Website Redesign','Revamp marketing site with new brand',D(20)],['p2','Mobile App v2','Cross-platform customer app',D(45)],['p3','Data Pipeline','ETL and analytics platform',D(70)]].map(a=>({id:a[0],name:a[1],desc:a[2],due:a[3]}));
const Sp=[{id:'s3',pid:'p1',name:'Sprint 1',start:D(-20),dur:14,goal:'Foundations',status:'done',vel:13},{id:'s1',pid:'p1',name:'Sprint 2',start:D(-6),dur:14,goal:'Landing + design system',status:'active'},{id:'s2',pid:'p2',name:'Sprint 1',start:D(-3),dur:14,goal:'Auth and onboarding',status:'active'},{id:'s4',pid:'p3',name:'Sprint 1',start:D(5),dur:14,goal:'Ingestion layer',status:'planned'}];
const T=[['p1','Design system tokens','done','High',-4,'u3','s1',5,['Design'],-5],['p1','Responsive homepage hero','prog','High',2,'u4','s1',8,['Frontend']],['p1','SEO audit','rev','Medium',1,'u2','s1',3,['Marketing']],['p1','Write pricing copy','todo','Low',6,'u3','s1',2,['Content']],['p1','Accessibility fixes','todo','High',-1,'u4','s1',5,['Frontend','Bug']],['p1','Set up analytics','done','Medium',-2,'u2','s1',3,['Infra'],-2],['p1','Blog template','backlog','Low',12,'','',3,['Frontend']],['p1','Newsletter signup form','backlog','Medium',15,'','',2,['Marketing']],['p1','Landing page A/B test','done','Medium',-12,'u3','s3',5,['Marketing'],-14],['p1','Brand guidelines','done','High',-14,'u2','s3',8,['Design'],-15],
['p2','Login and signup screens','prog','High',3,'u3','s2',5,['Auth']],['p2','Push notifications','todo','Medium',9,'u4','s2',8,['Backend']],['p2','Onboarding carousel','rev','Low',4,'u3','s2',3,['UI']],['p2','Profile page','done','Medium',-1,'u4','s2',3,['UI'],-1],['p2','Offline mode','backlog','High',30,'','',13,['Backend']],['p2','Dark theme','backlog','Low',35,'','',5,['UI']],
['p3','Kafka ingestion service','todo','High',14,'u4','s4',8,['Backend']],['p3','Schema registry','todo','Medium',18,'u2','s4',5,['Infra']],['p3','Data quality checks','backlog','Medium',40,'','',5,['QA']],['p3','Dashboard prototype','backlog','Low',50,'','',8,['BI']]];
return{theme:'light',sess:null,users:u,projects:P,sprints:Sp,notifs:[],act:[{t:'Workspace created with sample data',u:'u1',at:Date.now()}],
tasks:T.map(a=>({id:uid(),pid:a[0],title:a[1],status:a[2],pri:a[3],due:D(a[4]),asg:a[5],sprint:a[6]||null,pts:a[7],labels:a[8],doneAt:a[9]!=null?D(a[9]):null,desc:'Details for: '+a[1],ac:'Given the feature, when used, then it works as expected.',cl:[{t:'Plan',d:true},{t:'Implement',d:false}],cm:[]}))}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||seed();
let me=null,view='dash',cp=S.projects[0]?.id,F={q:'',pri:'',asg:''},Tk=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},user=i=>S.users.find(u=>u.id==i),mgr=()=>me.role!='Team Member',adm=()=>me.role=='Admin';
const av=i=>{const u=user(i);return u?`<span class=av title="${esc(u.name)}" style="background:${COL[S.users.indexOf(u)%6]}">${esc(u.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span>`:'<span class=mut>Unassigned</span>'};
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('toast').appendChild(d);setTimeout(()=>d.remove(),2800)}
const log=m=>{S.act.unshift({t:m,u:me.id,at:Date.now()});S.act=S.act.slice(0,40)},notify=(u,m,key)=>{if(key&&S.notifs.some(n=>n.key==key))return;S.notifs.unshift({id:uid(),u,m,at:Date.now(),read:false,key})};
const pt=p=>S.tasks.filter(t=>t.pid==p),kb=p=>pt(p).filter(t=>t.status!='backlog'),pct=a=>a.length?Math.round(a.filter(t=>t.status=='done').length/a.length*100):0;
const over=t=>t.status!='done'&&t.status!='backlog'&&t.due&&t.due<TD,score=t=>({High:3,Medium:2,Low:1}[t.pri])*10+(t.due?Math.max(0,10-days(TD,t.due)):0)+(over(t)?15:0);
const urgent=t=>t.status!='done'&&t.status!='backlog'&&t.due&&days(TD,t.due)<=2;
const spEnd=s=>{const d=new Date(s.start);d.setDate(d.getDate()+s.dur);return d.toISOString().slice(0,10)};
function health(s){const ts=S.tasks.filter(t=>t.sprint==s.id),tot=ts.reduce((a,t)=>a+t.pts,0)||1,dn=ts.filter(t=>t.status=='done').reduce((a,t)=>a+t.pts,0),ap=dn/tot*100,ep=Math.max(0,Math.min(100,days(s.start,TD)/s.dur*100));
let h=TD>spEnd(s)&&ap<100?['De','Delayed']:ap>=ep-10?['On','On Track']:ap>=ep-30?['At','At Risk']:['De','Delayed'];return{h,tot,dn,ap:Math.round(ap),ts}}
const hl=h=>`<span class="hl ${h[0]}">${h[1]}</span>`;
/* charts */
const bars=a=>{const m=Math.max(1,...a.map(x=>x.v));return`<div class=col2>${a.map(x=>`<div><small>${x.v}</small><i style="height:${x.v/m*100}px"></i><small class=mut>${esc(x.l)}</small></div>`).join('')}</div>`};
function donut(a){const tot=a.reduce((s,x)=>s+x.v,0);if(!tot)return'<div class=empty>No data</div>';let o=0;const r=40,c=2*Math.PI*r;return`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg width=110 height=110 viewBox="0 0 100 100" style="transform:rotate(-90deg)">${a.map((x,i)=>{const l=x.v/tot*c,s=`<circle cx=50 cy=50 r=${r} fill=none stroke="${COL[i%6]}" stroke-width=16 stroke-dasharray="${l} ${c-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</svg><div class=lg>${a.map((x,i)=>`<div><span><b style="background:${COL[i%6]}"></b>${esc(x.l)}: ${x.v}</span></div>`).join('')}</div></div>`}
function burn(s){if(!s)return'<div class=empty>No active sprint</div>';const n=s.dur,ts=S.tasks.filter(t=>t.sprint==s.id),tot=ts.reduce((a,t)=>a+t.pts,0),id=[],ac=[];for(let i=0;i<=n;i++){const d=new Date(s.start);d.setDate(d.getDate()+i);const ds=d.toISOString().slice(0,10);id.push(tot*(1-i/n));if(ds<=TD)ac.push(tot-ts.filter(t=>t.status=='done'&&(t.doneAt||s.start)<=ds).reduce((a,t)=>a+t.pts,0))}
const X=i=>10+i*(280/n),Y=v=>110-(tot?v/tot*100:0),pl=(a,c,dd)=>`<polyline fill=none stroke="${c}" stroke-width=2.5 ${dd?'stroke-dasharray=4':''} points="${a.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
return`<svg viewBox="0 0 300 125" width=100%>${pl(id,'#9aa0cc',1)}${pl(ac,'#6d4aff')}</svg><div class=lg><span><b style="background:#9aa0cc"></b>Ideal</span><span><b style="background:#6d4aff"></b>Actual (${tot} pts)</span></div>`}
/* views */
const V={};
V.dash=()=>{const all=S.tasks.filter(t=>t.status!='backlog'),dn=all.filter(t=>t.status=='done').length,ov=all.filter(over).length,s=S.sprints.find(x=>x.pid==cp&&x.status=='active'),hh=s&&health(s);
const st=[['Total Projects',S.projects.length],['Active Projects',S.projects.filter(p=>pct(kb(p.id))<100).length],['Completed Tasks',dn],['Pending Tasks',all.length-dn],['Overdue Tasks',ov]];
const up=all.filter(t=>t.status!='done'&&t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
return`<div class="grid g4">${st.map(x=>`<div class="card stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="grid g2" style="margin-top:14px">
<div class=card><h3>Current Sprint ${s?'– '+esc(S.projects.find(p=>p.id==cp).name)+' / '+esc(s.name):''} ${s?hl(hh.h):''}</h3>${s?`<div class=bar><i style="width:${hh.ap}%"></i></div><p class=mut>${hh.ap}% done · ${hh.dn}/${hh.tot} points · ${hh.ts.filter(t=>t.status!='done').length} tasks remaining</p>`:'<div class=empty>No active sprint for this project</div>'}<h3>Burndown</h3>${burn(s)}</div>
<div class=card><h3>Task Status</h3>${donut(COLS.map(c=>({l:c[1],v:all.filter(t=>t.status==c[0]).length})))}<h3 style="margin-top:14px">Productivity</h3><p class=mut>${all.length?Math.round(dn/all.length*100):0}% overall completion · ${S.tasks.filter(t=>t.doneAt&&days(t.doneAt,TD)<=7).length} tasks finished this week</p></div>
<div class=card><h3>Upcoming Deadlines</h3>${up.map(t=>`<div class=row><span>${urgent(t)?'🔥 ':''}${esc(t.title)}</span><span class="tag ${over(t)?'High':''}">${over(t)?'Overdue ':''}${t.due}</span></div>`).join('')||'<div class=empty>Nothing due</div>'}</div>
<div class=card><h3>Recent Activity</h3>${S.act.slice(0,6).map(a=>`<div class=row><span>${av(a.u)} ${esc(a.t)}</span><small class=mut>${new Date(a.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')}</div></div>`};
V.projects=()=>`<div class=tb>${mgr()?'<button class=btn onclick="projM()">+ New Project</button>':'<span class=mut>Only Admins and Project Managers can create projects.</span>'}</div><div class="grid g2">${S.projects.map(p=>{const k=kb(p.id);return`<div class=card><h3>${esc(p.name)}</h3><p class=mut>${esc(p.desc)}</p><div class=bar><i style="width:${pct(k)}%"></i></div><p class=mut>${pct(k)}% · ${k.length} tasks · Due ${p.due||'–'}</p><button class="btn s" onclick="cp='${p.id}';go('kanban')">Open Board</button> ${mgr()?`<button class="btn g s" onclick="projM('${p.id}')">Edit</button>`:''} ${adm()?`<button class="btn r s" onclick="delP('${p.id}')">Delete</button>`:''}</div>`}).join('')||'<div class=empty>No projects yet.</div>'}</div>`;
V.kanban=()=>`<div class=tb><input id=qa placeholder="⚡ Quick add task and press Enter" onkeydown="if(event.key=='Enter')quick(this)"><input placeholder="Search tasks…" value="${esc(F.q)}" oninput="F.q=this.value;board()"><select onchange="F.pri=this.value;board()"><option value="">All priorities</option>${['High','Medium','Low'].map(p=>`<option ${F.pri==p?'selected':''}>${p}</option>`).join('')}</select><select onchange="F.asg=this.value;board()"><option value="">All members</option>${S.users.map(u=>`<option value=${u.id} ${F.asg==u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select><button class=btn onclick="openTask()">+ Task</button></div><div class=board id=board></div>`;
function board(){const b=$('board');if(!b)return;const q=F.q.toLowerCase(),ts=kb(cp).filter(t=>(!q||(t.title+t.desc+t.labels.join()).toLowerCase().includes(q))&&(!F.pri||t.pri==F.pri)&&(!F.asg||t.asg==F.asg));
b.innerHTML=COLS.map(c=>{const l=ts.filter(t=>t.status==c[0]).sort((a,b)=>score(b)-score(a));return`<div class=col ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="drop(event,'${c[0]}')"><h4>${c[1]} <span class=tag>${l.length}</span></h4>${l.map(t=>{const cl=t.cl.length?t.cl.filter(x=>x.d).length+'/'+t.cl.length:'';return`<div class=tc draggable=true ondragstart="event.dataTransfer.setData('t','${t.id}')" onclick="openTask('${t.id}')"><div>${urgent(t)?'<b title="Urgent">🔥</b> ':''}<b>${esc(t.title)}</b></div><div><span class="tag ${t.pri}">${t.pri}</span>${t.labels.map(x=>`<span class=tag>${esc(x)}</span>`).join('')}</div><div class=row style="border:0;padding:6px 0 0"><small class="mut" style="${over(t)?'color:var(--bad)':''}">${t.due?'📅 '+t.due:''} ${cl?'☑ '+cl:''} ${t.cm.length?'💬'+t.cm.length:''}</small>${av(t.asg)}</div></div>`}).join('')||'<div class=empty>Drop tasks here</div>'}</div>`}).join('')}
V.backlog=()=>{const b=pt(cp).filter(t=>t.status=='backlog'),sp=S.sprints.filter(s=>s.pid==cp&&s.status!='done');return`<div class=tb><button class=btn onclick="openTask(null,{status:'backlog'})">+ User Story</button></div><div class=card>${b.map(t=>`<div class=row><div style="flex:1;min-width:200px"><b>${esc(t.title)}</b> <span class="tag ${t.pri}">${t.pri}</span> <span class=tag>${t.pts} pts</span><br><small class=mut>${esc(t.desc)} · AC: ${esc(t.ac)}</small></div>${av(t.asg)}<button class="btn g s" onclick="openTask('${t.id}')">Edit</button>${sp.length?`<select style="width:auto" onchange="toSprint('${t.id}',this.value)"><option value="">Move to sprint…</option>${sp.map(s=>`<option value=${s.id}>${esc(s.name)}</option>`).join('')}</select>`:'<small class=mut>Create a sprint first</small>'}</div>`).join('')||'<div class=empty>Backlog is empty. Add a user story.</div>'}</div>`};
V.sprints=()=>`<div class=tb>${mgr()?'<button class=btn onclick="sprM()">+ New Sprint</button>':''}</div><div class="grid g2">${S.sprints.filter(s=>s.pid==cp).map(s=>{const h=health(s),vs=S.sprints.filter(x=>x.pid==cp&&x.status=='done');return`<div class=card><h3>${esc(s.name)} <span class=tag>${s.status}</span> ${s.status=='active'?hl(h.h):''}</h3><p class=mut>${esc(s.goal)} · ${s.start} → ${spEnd(s)} (${s.dur}d)</p><div class=bar><i style="width:${s.status=='done'?100:h.ap}%"></i></div><p class=mut>${h.ts.filter(t=>t.status=='done').length} done · ${h.ts.filter(t=>t.status!='done').length} remaining · Velocity: ${s.status=='done'?s.vel:h.dn} pts${s.status!='done'&&vs.length?' (avg '+Math.round(vs.reduce((a,x)=>a+x.vel,0)/vs.length)+')':''}</p>${h.ts.map(t=>`<div class=row><small>${esc(t.title)}</small><span class=tag>${t.status}</span></div>`).join('')}${mgr()&&s.status!='done'?`<br>${s.status=='planned'?`<button class="btn g s" onclick="actS('${s.id}')">Start Sprint</button> `:''}<button class="btn s" onclick="doneS('${s.id}')">Complete Sprint</button>`:''}</div>`}).join('')||'<div class=empty>No sprints yet. Create one to start planning.</div>'}</div>`;
V.team=()=>`<div class="grid g4">${S.users.map(u=>{const o=S.tasks.filter(t=>t.asg==u.id&&t.status!='done'&&t.status!='backlog').length;return`<div class="card" style="text-align:center">${av(u.id)}<h3>${esc(u.name)}</h3><small class=mut>${esc(u.email)}</small><br>${adm()&&u.id!=me.id?`<select onchange="role('${u.id}',this.value)">${['Admin','Project Manager','Team Member'].map(r=>`<option ${u.role==r?'selected':''}>${r}</option>`).join('')}</select>`:`<span class=tag>${u.role}</span>`}<p class=mut>Workload: ${o} open tasks ${o>4?'⚠️ heavy':o<2?'· available':''}</p><div class=bar><i style="width:${Math.min(100,o*20)}%"></i></div></div>`}).join('')}</div>`;
V.reports=()=>{const all=S.tasks.filter(t=>t.status!='backlog'),s=S.sprints.find(x=>x.pid==cp&&x.status=='active'),dd=[...Array(7)].map((_,i)=>D(i-6));return`<div class="grid g2"><div class=card><h3>Sprint Burndown</h3>${burn(s)}</div><div class=card><h3>Task Completion (last 7 days)</h3>${bars(dd.map(d=>({l:d.slice(5),v:S.tasks.filter(t=>t.doneAt==d).length})))}</div><div class=card><h3>Team Performance (tasks done)</h3>${bars(S.users.map(u=>({l:u.name.split(' ')[0],v:S.tasks.filter(t=>t.asg==u.id&&t.status=='done').length})))}</div><div class=card><h3>Project Progress (%)</h3>${bars(S.projects.map(p=>({l:p.name.split(' ')[0],v:pct(kb(p.id))})))}</div><div class=card><h3>Priority Distribution</h3>${donut(['High','Medium','Low'].map(p=>({l:p,v:all.filter(t=>t.pri==p).length})))}</div><div class=card><h3>Completed vs Pending</h3>${donut([{l:'Completed',v:all.filter(t=>t.status=='done').length},{l:'Pending',v:all.filter(t=>t.status!='done').length}])}</div></div>`};
V.notifs=()=>{const n=S.notifs.filter(x=>x.u==me.id);return`<div class=tb><button class="btn g" onclick="S.notifs.forEach(x=>x.u==me.id&&(x.read=true));save();render()">Mark all read</button></div><div class=card>${n.map(x=>`<div class=row style="${x.read?'opacity:.6':''}"><span>${x.read?'':'🔵 '}${esc(x.m)}</span><small class=mut>${new Date(x.at).toLocaleString()}</small></div>`).join('')||'<div class=empty>You are all caught up 🎉</div>'}</div>`};
V.settings=()=>`<div class="card" style="max-width:480px"><h3>Profile</h3><label>Name</label><input id=pn value="${esc(me.name)}"><p class=mut>${esc(me.email)} · ${me.role}</p><button class=btn onclick="me.name=$('pn').value||me.name;save();render();toast('Profile saved')">Save</button> <button class="btn g" onclick="S.theme=S.theme=='dark'?'light':'dark';save();render()">Toggle ${S.theme=='dark'?'light':'dark'} mode</button> <button class="btn r" onclick="if(confirm('Reset all data to demo?')){localStorage.removeItem(K);location.reload()}">Reset demo data</button></div>`;
const TT={dash:'Dashboard',projects:'My Projects',kanban:'Kanban Board',backlog:'Backlog',sprints:'Sprints',team:'Team Members',reports:'Reports & Analytics',notifs:'Notifications',settings:'Settings'},IC={dash:'🏠',projects:'📁',kanban:'🗂️',backlog:'📋',sprints:'🏃',team:'👥',reports:'📊',notifs:'🔔',settings:'⚙️'};
const go=v=>{view=v;render()};
function render(){document.body.dataset.t=S.theme;if(!me){$('app').innerHTML=`<div class=auth><div class=logo style="color:var(--tx);text-align:center;font-size:30px">Sprint<span style="color:var(--pri)">board</span></div><div class=card><h3 id=at>Sign in</h3><div id=rf style="display:none"><label>Name</label><input id=rn></div><label>Email</label><input id=em value="admin@demo.com"><label>Password</label><input id=pw type=password value="demo123"><div id=rr style="display:none"><label>Role</label><select id=ro><option>Team Member</option><option>Project Manager</option><option>Admin</option></select></div><br><button class=btn style="width:100%" onclick="auth()" id=ab>Login</button><p class=mut id=ah>Demo: admin@demo.com, pm@demo.com, member@demo.com (password demo123)</p><a href=# style="color:var(--pri)" onclick="reg();return false" id=sw>Create an account</a></div></div>`;return}
if(!S.projects.find(p=>p.id==cp))cp=S.projects[0]?.id;const un=S.notifs.filter(n=>n.u==me.id&&!n.read).length;
$('app').innerHTML=`<aside id=sb><div class=logo>Sprint<span>board</span></div>${Object.keys(TT).map(k=>`<div class="nv ${view==k?'on':''}" onclick="$('sb').classList.remove('o');go('${k}')">${IC[k]} ${TT[k]}${k=='notifs'&&un?` <span class=tag style="background:#ef4444;color:#fff">${un}</span>`:''}</div>`).join('')}<div class=nv onclick="logout()">🚪 Logout (${esc(me.name.split(' ')[0])})</div></aside><main><div class=top><button class="btn g s hb" onclick="$('sb').classList.toggle('o')">☰</button><h2>${TT[view]}</h2>${['kanban','backlog','sprints','reports','dash'].includes(view)?`<select onchange="cp=this.value;render()">${S.projects.map(p=>`<option value=${p.id} ${p.id==cp?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}<span class=tag>${me.role}</span></div><div class=pg>${S.projects.length||view=='projects'||view=='team'||view=='notifs'||view=='settings'?V[view]():'<div class=empty>No projects. Create one under My Projects.</div>'}</div></main>`;board()}
let reg_=false;function reg(){reg_=!reg_;['rf','rr'].forEach(i=>$(i).style.display=reg_?'block':'none');$('at').textContent=reg_?'Register':'Sign in';$('ab').textContent=reg_?'Register':'Login';$('sw').textContent=reg_?'Have an account? Login':'Create an account';$('ah').style.display=reg_?'none':'block'}
function auth(){const e=$('em').value.trim().toLowerCase(),p=$('pw').value;if(reg_){if(!$('rn').value.trim()||!e.includes('@')||p.length<4)return toast('Enter name, valid email and 4+ char password','e');if(S.users.some(u=>u.email==e))return toast('Email already registered','e');const u={id:uid(),name:$('rn').value.trim(),email:e,pw:p,role:$('ro').value};S.users.push(u);S.sess=u.id}else{const u=S.users.find(u=>u.email==e&&u.pw==p);if(!u)return toast('Invalid email or password','e');S.sess=u.id}
me=user(S.sess);save();scan();toast('Welcome, '+me.name);render()}
function logout(){S.sess=null;me=null;save();render()}
function scan(){S.tasks.filter(t=>t.asg==me.id&&t.status!='done'&&t.status!='backlog'&&t.due).forEach(t=>{if(t.due<TD)notify(me.id,'Overdue: '+t.title,'o'+t.id+TD);else if(days(TD,t.due)<=2)notify(me.id,'Due soon ('+t.due+'): '+t.title,'d'+t.id+TD)});save()}
/* modals */
function modal(h){let m=$('mdl');if(!m){m=document.createElement('div');m.id='mdl';m.className='mdl';m.onclick=e=>{if(e.target==m)closeM()};document.body.appendChild(m)}m.innerHTML='<div>'+h+'</div>'}
const closeM=()=>{$('mdl')?.remove()};
function projM(id){const p=S.projects.find(x=>x.id==id)||{name:'',desc:'',due:D(30)};modal(`<h3>${id?'Edit':'New'} Project</h3><label>Name</label><input id=pn2 value="${esc(p.name)}"><label>Description</label><textarea id=pd>${esc(p.desc)}</textarea><label>Deadline</label><input type=date id=pdl value="${p.due}"><br><br><button class=btn onclick="saveP('${id||''}')">Save</button> <button class="btn g" onclick="closeM()">Cancel</button>`)}
function saveP(id){const n=$('pn2').value.trim();if(!n)return toast('Project name is required','e');if(id){Object.assign(S.projects.find(p=>p.id==id),{name:n,desc:$('pd').value,due:$('pdl').value})}else{const p={id:uid(),name:n,desc:$('pd').value,due:$('pdl').value};S.projects.push(p);cp=p.id}log('Saved project '+n);save();closeM();render();toast('Project saved')}
function delP(id){if(!confirm('Delete project and all its tasks?'))return;S.projects=S.projects.filter(p=>p.id!=id);S.tasks=S.tasks.filter(t=>t.pid!=id);S.sprints=S.sprints.filter(s=>s.pid!=id);log('Deleted a project');save();render();toast('Project deleted')}
function sprM(){modal(`<h3>New Sprint</h3><label>Name</label><input id=sn value="Sprint ${S.sprints.filter(s=>s.pid==cp).length+1}"><div class=two><div><label>Start date</label><input type=date id=ss value="${TD}"></div><div><label>Duration</label><select id=sd><option value=7>1 week</option><option value=14 selected>2 weeks</option><option value=21>3 weeks</option><option value=28>4 weeks</option></select></div></div><label>Goal</label><input id=sg><br><br><button class=btn onclick="saveS()">Create</button> <button class="btn g" onclick="closeM()">Cancel</button>`)}
function saveS(){const n=$('sn').value.trim();if(!n)return toast('Sprint name required','e');S.sprints.push({id:uid(),pid:cp,name:n,start:$('ss').value||TD,dur:+$('sd').value,goal:$('sg').value,status:S.sprints.some(s=>s.pid==cp&&s.status=='active')?'planned':'active'});log('Created sprint '+n);save();closeM();render();toast('Sprint created')}
const actS=id=>{if(S.sprints.some(s=>s.pid==cp&&s.status=='active'))return toast('Another sprint is already active','e');S.sprints.find(s=>s.id==id).status='active';save();render()};
function doneS(id){const s=S.sprints.find(x=>x.id==id),ts=S.tasks.filter(t=>t.sprint==id);s.vel=ts.filter(t=>t.status=='done').reduce((a,t)=>a+t.pts,0);s.status='done';ts.filter(t=>t.status!='done').forEach(t=>{t.sprint=null;t.status='backlog'});log('Completed '+s.name);save();render();toast('Sprint completed. Unfinished items returned to backlog.')}
function toSprint(id,sid){if(!sid)return;const t=S.tasks.find(x=>x.id==id);t.sprint=sid;t.status='todo';log('Moved "'+t.title+'" to sprint');save();render();toast('Moved to sprint')}
const role=(id,r)=>{user(id).role=r;save();toast('Role updated')};
function quick(i){const v=i.value.trim();if(!v)return;S.tasks.push({id:uid(),pid:cp,title:v,desc:'',ac:'',status:'todo',pri:'Medium',due:D(7),asg:me.id,sprint:null,pts:2,labels:[],cl:[],cm:[],doneAt:null});log('Quick-added "'+v+'"');save();render();toast('Task added')}
function drop(e,st){e.preventDefault();const t=S.tasks.find(x=>x.id==e.dataTransfer.getData('t'));if(!t||t.status==st)return render();setSt(t,st);log('Moved "'+t.title+'" to '+st);save();render()}
const setSt=(t,st)=>{t.status=st;t.doneAt=st=='done'?TD:null};
function openTask(id,pre){Tk=id?JSON.parse(JSON.stringify(S.tasks.find(t=>t.id==id))):{id:null,pid:cp,title:'',desc:'',ac:'',status:'todo',pri:'Medium',due:D(7),asg:'',sprint:null,pts:3,labels:[],cl:[],cm:[],doneAt:null,...pre};drawT()}
function readT(){if(!$('tt'))return;Object.assign(Tk,{title:$('tt').value,desc:$('td').value,ac:$('ta').value,status:$('ts').value,pri:$('tp').value,asg:$('tu').value,due:$('tdd').value,pts:+$('tpt').value||1,labels:$('tl').value.split(',').map(x=>x.trim()).filter(Boolean)})}
function drawT(){const T=Tk;modal(`<h3>${T.id?'Edit':'New'} ${T.status=='backlog'&&!T.id?'User Story':'Task'}</h3><label>Title</label><input id=tt value="${esc(T.title)}"><label>Description</label><textarea id=td rows=2>${esc(T.desc)}</textarea><label>Acceptance criteria</label><textarea id=ta rows=2>${esc(T.ac)}</textarea><div class=two><div><label>Status</label><select id=ts>${[['backlog','Backlog'],...COLS].map(c=>`<option value=${c[0]} ${T.status==c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><div><label>Priority</label><select id=tp>${['High','Medium','Low'].map(p=>`<option ${T.pri==p?'selected':''}>${p}</option>`).join('')}</select></div><div><label>Assignee</label><select id=tu><option value="">Unassigned</option>${S.users.map(u=>`<option value=${u.id} ${T.asg==u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div><label>Due date</label><input type=date id=tdd value="${T.due||''}"></div><div><label>Story points</label><input type=number min=1 id=tpt value="${T.pts}"></div><div><label>Labels (comma separated)</label><input id=tl value="${esc(T.labels.join(', '))}"></div></div>
<label>Checklist</label>${T.cl.map((c,i)=>`<div><label style="display:inline;color:var(--tx)"><input type=checkbox style="width:auto" ${c.d?'checked':''} onchange="readT();Tk.cl[${i}].d=this.checked;drawT()"> ${esc(c.t)}</label> <a href=# onclick="readT();Tk.cl.splice(${i},1);drawT();return false">✕</a></div>`).join('')}<div style="display:flex;gap:6px"><input id=ncl placeholder="Add item"><button class="btn g s" onclick="const v=$('ncl').value.trim();if(v){readT();Tk.cl.push({t:v,d:false});drawT()}">Add</button></div>
<label>Comments</label>${T.cm.map(c=>`<div class=row><span>${av(c.u)} ${esc(c.t)}</span></div>`).join('')}<div style="display:flex;gap:6px"><input id=ncm placeholder="Write a comment"><button class="btn g s" onclick="const v=$('ncm').value.trim();if(v){readT();Tk.cm.push({u:me.id,t:v});drawT()}">Post</button></div><br>
<button class=btn onclick="saveT()">Save</button> <button class="btn g" onclick="closeM()">Cancel</button> ${T.id&&mgr()?'<button class="btn r" style="float:right" onclick="delT()">Delete</button>':''}`)}
function saveT(){readT();if(!Tk.title.trim())return toast('Title is required','e');const old=Tk.id&&S.tasks.find(t=>t.id==Tk.id);if(old){if(old.status!=Tk.status)setSt(Tk,Tk.status);else Tk.doneAt=old.doneAt;Object.assign(old,Tk)}else{Tk.id=uid();if(Tk.status=='done')Tk.doneAt=TD;S.tasks.push(Tk)}
if(Tk.asg&&Tk.asg!=me.id&&(!old||old.asg!=Tk.asg))notify(Tk.asg,me.name+' assigned you: '+Tk.title);log('Saved task "'+Tk.title+'"');save();closeM();render();toast('Task saved')}
function delT(){if(!confirm('Delete this task?'))return;S.tasks=S.tasks.filter(t=>t.id!=Tk.id);log('Deleted "'+Tk.title+'"');save();closeM();render();toast('Task deleted')}
if(S.sess&&(me=user(S.sess)))scan();render();
</script></body></html>
